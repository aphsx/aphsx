name: Odds collector (hourly)

on:
  schedule:
    # Every hour UTC — adjust if Odds API quota is tight (free ~500/mo).
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements-odds.txt

      - name: Collect odds → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_SOCCER_SPORT_KEYS: ${{ vars.ODDS_SOCCER_SPORT_KEYS }}
          ODDS_ESPORTS_SPORT_KEYS: ${{ vars.ODDS_ESPORTS_SPORT_KEYS }}
          ODDS_REGIONS: ${{ vars.ODDS_REGIONS }}
          ODDS_LOOKAHEAD_DAYS: ${{ vars.ODDS_LOOKAHEAD_DAYS }}
        run: |
          python scripts/odds_tracker/collector.py --discover-esports
